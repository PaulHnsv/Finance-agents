[project]
name = "investimentos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.54.0",
    "tenacity>=9.0.0",
    "langgraph>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "typer>=0.13.0",
    "plotext>=5.2.8",
    "matplotlib>=3.9.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.48",
    "ofxparse>=0.21",
    "python-dotenv>=1.0.0",
    "langfuse>=2.56.0",
    "weasyprint>=62.3",
    "apscheduler>=3.10.4",
    "rich>=13.9.0",
]

[project.scripts]
investimentos = "investimentos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investimentos"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.112.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
